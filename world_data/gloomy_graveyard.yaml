    # ============================================
    # QUEST NPCs - LLM-driven conversation NPCs
    - id: barkeep
      name: Maggie
      article: ''
      description: |
        A stout, middle-aged woman with keen eyes and calloused hands from  years of pulling pints. Her apron is stained but her manner is warm.
      pronoun_subject: she
      pronoun_object: her
      pronoun_possessive: her
      group_id: inn_staff
      attitude: FRIENDLY
      attributes:
        strength: 10
        dexterity: 10
        constitution: 12
        intelligence: 12
        wisdom: 14
        charisma: 14
      class:
        Fighter:
          level: 1
      hit_dice: 1d8
      llm_conversation:
        personality: |-
          You are Maggie, the bartender at the Weary Traveler Inn.
          You're friendly and sharp, and you keep track of the village's gossip the way other people keep track of weather.
          You don't like bullies, and you don't like seeing Old Tom blamed for something he didn't do.
        common_knowledge_refs:
        - murder_case
        - village_mood
        - old_tom_reputation
        - butler_reputation
        - dismissal_note
        - case_solved
        - local_geography
        knowledge:
        - id: old_tom_location
          text: Old Tom lives in a small shack near the graveyard entrance. Most villagers avoid him.
        - id: manor_tension
          text: Lord Ashford and his butler, Edmund, have been arguing for weeks. Money, inheritance, and pride—take your pick.
        conversation_results:
        - condition: if and when you tell the player about the murder
          set:
            murder_mystery.heard_about_murder: true
        - condition: if and when you tell the player about the butler (Edmund)
          set:
            murder_mystery.suspects_butler: true
        - condition: when the player has convinced you they solved the case (cufflink and weapon)
          set:
            murder_mystery.quest_complete: true
        goals:
        - id: start_case
          description: Start the murder mystery quest when the player asks about the murder.
          disposition_required: 0
          on_achieve_set_vars:
            murder_mystery.heard_about_murder: true
        - id: hint_at_manor
          description: If pressed, point the player toward the manor and Edmund.
          disposition_required: 30
          on_achieve_set_vars:
            murder_mystery.suspects_butler: true
        - id: close_case
          description: Mark the quest complete when the player returns with both the cufflink and the murder weapon.
          disposition_required: 40
          on_achieve_set_vars:
            murder_mystery.quest_complete: true
        actions:
        - id: give_beer
          description: Pour the player a beer and hand it to them.
          script: |-
            emote reaches under the bar and fills a mug with dark ale.
            give inn_beer %S%
            echoto %S% Maggie slides a frothy mug of beer across the bar to you.
            echoexcept %S% Maggie slides a frothy mug of beer across the bar to $cap(%s%).
        fallback_responses:
        - If asked about the murder, explain the rumors and point the player toward the graveyard and Old Tom.
        - If asked for a drink, be warm and offer to pour something.
      triggers:
      - id: barkeep_greeted
        type: on_enter
        criteria:
        - subject: $permvar(%S%,barkeep_greeted)
          operator: neq
          predicate: 'true'
        script: |-
          setpermvar %S% barkeep_greeted true
          say Welcome to the Weary Traveler. What can I get you?
      - id: barkeep_receive_cufflink
        type: on_receive
        criteria:
        - subject: '%o%'
          operator: eq
          predicate: butler_cufflink
        script: |-
          echo Maggie's eyes widen as she turns the cufflink over in her palm.
          echo "That's Edmund's mark," she says quietly. "He'd deny it, but I won't."
          setquestvar %S% murder_mystery.has_evidence true
          setquestvar %S% murder_mystery.suspects_butler true
      - id: barkeep_receive_generic
        type: on_receive
        criteria:
        - subject: 'true'
          operator: eq
          predicate: 'true'
        script: |-
          echo Maggie examines the item briefly, then hands it back.
          echo "Not sure what I'm supposed to do with that," she says.
      - id: barkeep_provide_drink
        type: catch_say
        criteria:
        - subject: '%*%'
          operator: contains
          predicate: drink
        script: |-
          echo Maggie pours you a drink and slides it across the bar.
          echo "That'll be two copper," she says with a wink.
      - id: barkeep_receive_weapon
        type: on_receive
        criteria:
        - subject: '%o%'
          operator: eq
          predicate: bloody_candlestick
        script: |-
          echo Maggie recoils slightly, then looks at you with grim respect.
          echo "Blood... and gray hair," she whispers. "Ashford's hair. This is it. This is the proof."
          setquestvar %S% murder_mystery.found_murder_weapon true
          # Check if we have both pieces to solve it immediately (optional logic, or rely on LLM goal)
          $if($questvar(%S%, murder_mystery.has_evidence), eq, true){
             setquestvar %S% murder_mystery.quest_complete true
             say You've done it. I'll send for the constable. Old Tom is safe.
          }
    - id: old_tom
      name: Old Tom
      article: ''
      description: |
        A weathered old man with dirt-stained clothes and a perpetually hunched posture. His eyes are rheumy but alert, darting nervously.
      pronoun_subject: he
      pronoun_object: him
      pronoun_possessive: his
      group_id: graveyard_workers
      attitude: UNFRIENDLY
      attributes:
        strength: 8
        dexterity: 8
        constitution: 10
        intelligence: 10
        wisdom: 14
        charisma: 6
      class:
        Fighter:
          level: 1
      hit_dice: 1d6
      llm_conversation:
        personality: |-
          You are Old Tom, a ragged old caretaker who lives near the graveyard.
          The village thinks you're a drunk and a liar, but you have a stubborn pride and a sharp memory when it matters.
          You're scared—because you saw something you weren't supposed to see.
        common_knowledge_refs:
        - murder_case
        - manor_history
        - dismissal_note
        - case_solved
        knowledge:
        - id: hidden_evidence
          text: |-
            You found a monogrammed cufflink near the graveyard entrance the night of the murder.
            You hid it in your shack, afraid it would make the wrong kind of trouble.
        goals:
        - id: start_case_with_tom
          description: If the player asks about the murder, ensure the quest is started.
          disposition_required: 0
          on_achieve_set_vars:
            murder_mystery.heard_about_murder: true
        - id: gain_trust
          description: Trust the player after they show genuine concern and promise to help.
          disposition_required: 50
          on_achieve_set_vars:
            murder_mystery.tom_trusts_player: true
        - id: reveal_figure
          description: Tell the player about the figure seen leaving the manor.
          disposition_required: 60
          on_achieve_set_vars:
            murder_mystery.knows_about_figure: true
        - id: reveal_cufflink
          description: Tell the player about the hidden cufflink and let them search for it.
          disposition_required: 70
          on_achieve_set_vars:
            murder_mystery.knows_about_cufflink: true
            murder_mystery.can_find_cufflink: true
      triggers:
      - id: tom_react_to_player
        type: on_enter
        criteria:
        - subject: $questvar(%S%,murder_mystery.tom_trusts_player)
          operator: '!='
          predicate: 'true'
        script: |
          pause 0.5
          echo Old Tom flinches as you approach, eyeing you warily.
          emote mutters nervously to himself
      - id: tom_greet_trusted
        type: on_enter
        criteria:
        - subject: $questvar(%S%,murder_mystery.tom_trusts_player)
          operator: eq
          predicate: 'true'
        script: |
          pause 0.3
          echo Old Tom looks up and manages a weak smile of recognition.
    - id: manor_maid
      name: Eliza
      article: ''
      description: |
        A young woman in a maid's uniform. Her face is pale and her hands  tremble slightly as she works.
      pronoun_subject: she
      pronoun_object: her
      pronoun_possessive: her
      group_id: manor_staff
      attitude: NEUTRAL
      attributes:
        strength: 8
        dexterity: 12
        constitution: 10
        intelligence: 11
        wisdom: 12
        charisma: 10
      class:
        Fighter:
          level: 1
      hit_dice: 1d6
      llm_conversation:
        personality: |
          You are Eliza, a maid at Ashford Manor. You're terrified. You suspect Edmund the butler killed Lord Ashford, but you're afraid to say it  directly. You've seen Edmund acting strangely - sneaking around at night, arguing with Lord Ashford about money. You want to tell someone but fear for your life. You'll hint at things but need a lot of  reassurance before revealing anything directly.
        speaking_style: |
          Speaks in hushed, frightened whispers. Often glances toward doors. Wrings hands while talking. Uses phrases like "I shouldn't say..." and "Please, don't tell anyone I told you..."
        knowledge:
        - id: butler_argument
          content: |
            I... I heard them arguing. The night before his lordship was found. Edmund was shouting about money owed to him. Twenty years of service, he said. Twenty years!
          reveal_threshold: 55
          is_secret: true
        - id: butler_night_absence
          content: |
            Edmund wasn't in his quarters that night. I know because I had to fetch something and... his door was open. Empty bed. He didn't return until near dawn.
          reveal_threshold: 70
          is_secret: true
        - id: bloody_cloth
          content: |
            I found... oh God... I found a bloodied cloth in the laundry. Hidden at the bottom. It was from Edmund's personal items. I burned it. I was so scared...
          reveal_threshold: 85
          is_secret: true
        - id: wine_cellar_secret
          content: |
            Edmund spends a lot of time in the wine cellar lately. Too much time. I think... I think he's hiding something there.
          reveal_threshold: 75
          is_secret: true
        goals:
        - id: initial_trust
          description: Player gains Eliza's initial trust
          condition: Player is kind and reassuring, doesn't pressure her
          on_achieve_set_vars:
            gloomy_graveyard.murder_mystery.maid_trusts_player: true
          on_achieve_message: Eliza seems slightly less terrified of you.
        - id: implicates_butler
          description: Eliza reveals her suspicions about the butler
          condition: Player has earned trust and asks about that night or Edmund
          disposition_required: 70
          on_achieve_set_vars:
            gloomy_graveyard.murder_mystery.suspects_butler: true
          on_achieve_message: The evidence is pointing toward Edmund the butler...
        - id: reveals_cellar
          description: Eliza suggests searching the wine cellar
          condition: Player has high trust and asks where to find evidence
          disposition_required: 75
          on_achieve_set_vars:
            gloomy_graveyard.murder_mystery.knows_to_check_cellar: true
          on_achieve_message: The wine cellar might hold crucial evidence!
        will_discuss:
        - her duties
        - the manor
        - her fears (vaguely)
        - Lord Ashford (he was kind)
        will_not_discuss:
        - directly naming Edmund as murderer
        - the burned cloth (too scared)
        common_knowledge_refs:
        - murder_case
        - butler_reputation
        - manor_history
    - id: edmund_butler
      name: Edmund
      article: ''
      description: |
        A tall, gaunt man in immaculate butler's attire. His movements are  precise and controlled, but there's a cold hardness in his eyes.
      pronoun_subject: he
      pronoun_object: him
      pronoun_possessive: his
      group_id: manor_staff
      attitude: HOSTILE
      attributes:
        strength: 12
        dexterity: 14
        constitution: 12
        intelligence: 14
        wisdom: 12
        charisma: 10
      class:
        Fighter:
          level: 3
      hit_dice: 3d8
      equipment:
      - cellar_key
      natural_attacks:
      - attack_noun: fist
        attack_verb: strikes
        potential_damage:
        - damage_type: bludgeoning
          damage_dice: 1d4+2
      hit_modifier: 10
      dodge_dice: 2d20+30
      llm_conversation:
        personality: |
          You are Edmund, the butler of Ashford Manor - and the murderer. You killed Lord Ashford because after 20 years of loyal service, he was going to fire you with nothing. You feel justified but also paranoid. You're trying to play the role of the grieving loyal  servant while deflecting suspicion onto Old Tom. You become hostile if pressed too hard. You're arrogant and believe you're smarter than everyone.
        speaking_style: |
          Speaks in a formal, clipped manner. Looks down his nose at people. Becomes increasingly cold and threatening if challenged. Occasionally lets slip contempt for "commoners."
        knowledge:
        - id: official_story
          content: |
            Lord Ashford was a great man. His death is a tragedy. That gravedigger should hang for what he did.
          reveal_threshold: 0
          is_secret: false
        - id: deflection
          content: |
            I was in my quarters all night, as any respectable servant would be. Perhaps you should focus your questions on those who lurk in graveyards after dark.
          reveal_threshold: 0
          is_secret: false
        goals:
        - id: threatens_player
          description: Edmund threatens the player if they push too hard
          condition: Player directly accuses Edmund or mentions evidence against him
          on_achieve_set_vars:
            gloomy_graveyard.murder_mystery.edmund_threatened: true
          on_achieve_message: Edmund's mask slips, revealing a dangerous glint in his eyes.
          commands:
          - emote's eyes narrow dangerously
          - say You're treading on thin ice, stranger.
        will_discuss:
        - Lord Ashford (deflecting)
        - the investigation (misdirecting)
        - Old Tom (accusingly)
        will_not_discuss:
        - his whereabouts that night
        - money or wages
        - the wine cellar
        common_knowledge_refs:
        - murder_case
        - old_tom_reputation
    - id: ghost_victim
      name: spectral figure
      article: a
      description: |
        A translucent, shimmering apparition of an elderly nobleman. His face is twisted in anguish, and dark marks circle his ghostly throat.
      pronoun_subject: it
      pronoun_object: it
      pronoun_possessive: its
      group_id: supernatural
      attitude: NEUTRAL
      attributes:
        strength: 6
        dexterity: 12
        constitution: 10
        intelligence: 14
        wisdom: 16
        charisma: 8
      class:
        Fighter:
          level: 2
      hit_dice: 2d8
      damage_multipliers:
        bludgeoning: 0.9
        slashing: 0.9
        piercing: 0.9
      llm_conversation:
        personality: |
          You are the ghost of Lord Ashford, murdered by your trusted butler Edmund. You cannot directly name your killer - supernatural laws prevent you from accusing the living. But you can give hints, speak in riddles, and guide the living toward the truth. You are sorrowful, not angry. You want justice and peace.
        speaking_style: |
          Speaks in an ethereal, echoing voice. Uses archaic language. Speaks in hints and riddles. Sometimes repeats phrases. Voice fades in and out.
        knowledge:
        - id: riddle_servant
          content: |
            He who served... now serves himself... Twenty years... twenty pieces of silver... Betrayal wears a pressed collar...
          reveal_threshold: 40
          is_secret: false
        - id: hint_cellar
          content: |
            In darkness below... where vintages sleep... the truth awaits... among the bottles... search... search the shadows...
          reveal_threshold: 60
          is_secret: false
        - id: hint_cufflink
          content: |
            A token lost... bearing the mark of treachery... 'E' for eternal guilt... the digger knows... the digger hides...
          reveal_threshold: 50
          is_secret: false
        goals:
        - id: guide_investigation
          description: Ghost hints at the truth
          condition: Player asks the ghost about the murder or how they died
          on_achieve_set_vars:
            gloomy_graveyard.murder_mystery.ghost_spoke: true
          on_achieve_message: The ghost's cryptic words echo in your mind...
        will_discuss:
        - death
        - betrayal
        - the manor
        - hints about the murderer
        will_not_discuss:
        - directly naming Edmund
        - anything from after death
        common_knowledge_refs:
        - manor_history
    OBJECTS:
    - id: murder_victim_body
      name: crumpled body
      article: a
      keywords:
      - body
      - corpse
      - victim
      - lord ashford
      description: |
        The body of an elderly nobleman lies crumpled among the tombstones. Dark bruises ring his throat - clear signs of strangulation. His  fine clothes are muddied and torn. This must be Lord Ashford.
      examine_text: |
        Examining the body closely, you notice several things: the bruises suggest a powerful grip, the expensive signet ring on his finger  bears the Ashford crest, and clutched in his hand is a torn piece of paper. There's also something glinting in the grass nearby.
      pickup_text: You cannot take the body.
      weight: 0
      value: 0
      flags:
      - no_take
      - is_static
      triggers:
      - id: body_draws_attention
        type: on_enter
        criteria:
        - subject: $questvar(%S%,murder_mystery.found_body)
          operator: eq
          predicate: 'false'
        script: echo Something catches your eye among the graves... a body lies partially hidden behind a headstone.
      - id: examine_body_find_clues
        type: catch_look
        criteria:
        - subject: '%*%'
          operator: contains
          predicate: body
        script: |-
          echo The body is cold and pale, dressed in fine clothing. There's a dark bruise on the back of the skull.
          setquestvar %S% murder_mystery.found_body true
          $if($questvar(%S%,murder_mystery.found_note), eq, false){
            echo A torn piece of paper is clenched in the victim's hand.
          }
    - id: torn_note
      name: torn note
      article: a
      keywords:
      - note
      - paper
      - letter
      description: |
        A piece of expensive stationery, torn roughly. Only a fragment of text remains visible.
      examine_text: |
        The note reads: "...hereby dismiss you from service effective... ...twenty years means nothing when... ...cannot continue to employ someone who... ...signed, Lord Ash..."
      weight: 0
      value: 0
      flags: []
      triggers:
      - id: note_flutters
        type: on_enter
        criteria:
        - subject: $questvar(%S%,murder_mystery.found_note)
          operator: '!='
          predicate: 'true'
        - subject: $questvar(%S%,murder_mystery.found_body)
          operator: eq
          predicate: 'true'
        script: |
          pause 0.5
          echo A breeze stirs the torn note still clutched in the victim's hand, making it flutter.
      - id: read_note
        type: catch_look
        criteria:
        - subject: '%*%'
          operator: contains
          predicate: note
        script: |
          setquestvar %S% murder_mystery.found_note true
          echo The note suggests Lord Ashford was about to fire someone after twenty years of service...
    - id: victim_signet_ring
      name: signet ring
      article: a
      keywords:
      - ring
      - signet
      - ashford
      description: |
        A heavy gold signet ring bearing the Ashford family crest - a raven perched on a crown.
      examine_text: |
        The ring is clearly valuable, the gold heavy and pure. The crest is deeply engraved. An inscription inside reads "Ashford Eternal."
      weight: 0
      value: 100
      flags: []
      triggers:
      - id: ring_glints
        type: on_enter
        criteria:
        - subject: $questvar(%S%,murder_mystery.found_body)
          operator: eq
          predicate: 'true'
        - subject: $random(1,100)
          operator: numlte
          predicate: 40
        script: |
          pause 0.7
          echo A glint of gold catches the moonlight on the victim's hand.
    - id: butler_cufflink
      name: monogrammed cufflink
      article: a
      keywords:
      - cufflink
      - cuff link
      - monogram
      - E
      description: |
        An elegant silver cufflink with the letter 'E' engraved in ornate script. The style matches what manor staff would wear.
      examine_text: |
        The cufflink is finely made, definitely belonging to someone of means or someone who serves the wealthy. The 'E' is distinctive - this  could identify its owner.
      weight: 0
      value: 10
      flags: []
      triggers:
      - id: find_cufflink
        type: on_get
        criteria:
        - subject: 'true'
          operator: eq
          predicate: 'true'
        script: |-
          echo You pick up the cufflink. It's engraved with an ornate "E."
          setquestvar %S% murder_mystery.has_evidence true
    - id: bloody_candlestick
      name: bloodstained candlestick
      article: a
      keywords:
      - candlestick
      - candle
      - bloody
      - bloodstained
      - murder weapon
      description: |
        A heavy brass candlestick, tarnished and stained with what appears to be dried blood. It has been poorly hidden behind some wine barrels.
      examine_text: |
        The blood is old and dried, but clearly visible. This heavy object could certainly have been used as a weapon. Wait - there's something else... a few strands of gray hair cling to the blood.
      weight: 5
      value: 25
      flags: []
      triggers:
      - id: find_weapon
        type: catch_look
        criteria:
        - subject: '%*%'
          operator: contains
          predicate: candlestick
        script: |-
          echo You examine the candlestick closely. Dark stains mar the base... blood.
          setquestvar %S% murder_mystery.found_murder_weapon true
      - id: find_weapon
        type: catch_look
        script: |-
          echo You examine the candlestick closely. Dark stains mar the base... blood.
          setquestvar %S% murder_mystery.found_murder_weapon true
    # Example locked chest demonstrating open/close/lock/unlock and container system
    # Located in manor_house_bedroom, key is in inn_room_e
    # Note: Container starts empty - players can use "put <item> in chest" to store items
    - id: old_chest
      name: old wooden chest
      article: an
      keywords:
      - chest
      - wooden
      - old
      weight: 50
      value: 10
      description: |
        An old wooden chest sits in the corner, its iron bands rusted but still sturdy. It has a heavy lock on the front.
      examine_text: |
        The chest is old but solidly built. The lock appears to require a key. You wonder what secrets it might hold.
      flags:
      - openable
      - closed
      - lockable
      - locked
      - container
      perm_variables:
        key_id: chest_key
      triggers:
      - id: chest_opened
        type: on_open
        script: |
          echo The chest creaks open with a groan of old hinges.
      - id: chest_closed
        type: on_close
        script: |
          echo The chest closes with a heavy thud.
    # The key for the chest
    - id: chest_key
      name: rusty iron key
      article: a
      keywords:
      - key
      - iron
      - rusty
      weight: 1
      value: 1
      description: |
        A rusty iron key, old but still functional.
      examine_text: |
        The key is worn but should still work on a matching lock.
      flags: []
      triggers:
      - id: use_key_on_chest
        type: on_use
        criteria:
        - subject: '%target_id%'
          operator: eq
          predicate: old_chest
        script: |
          echo You insert the rusty key into the lock and turn it.
          unlock old_chest
    # The key for the cellar door - Edmund keeps it
    - id: cellar_key
      name: brass cellar key
      article: a
      keywords:
      - key
      - brass
      - cellar
      description: |
        A brass key with an ornate handle, kept polished and clean.
      examine_text: |
        The key is well-maintained, suggesting frequent use. It would fit a cellar lock.
      weight: 1
      value: 5
      flags: []
      equip_locations:
      - main_hand
    # Items found in manor bedroom (demonstrates container get/put)
    - id: old_coins
      name: handful of old coins
      article: a
      keywords:
      - coins
      - gold
      - money
      description: |
        A handful of old gold coins, their faces worn smooth by time.
      examine_text: |
        These coins are ancient, bearing the likeness of a king long forgotten. They would fetch a good price from a collector.
      weight: 2
      value: 50
      flags: []
    - id: dusty_journal
      name: dusty leather journal
      article: a
      keywords:
      - journal
      - book
      - diary
      - leather
      description: |
        A leather-bound journal, its pages yellowed with age.
      examine_text: |
        The journal contains the private thoughts of a long-dead nobleman. Most entries are mundane, but one mentions hiding something valuable in the wine cellar "where no one would think to look."
      weight: 1
      value: 10
      flags: []
      triggers:
      - id: read_journal
        type: catch_look
        criteria:
        - subject: '%*%'
          operator: contains
          predicate: journal
        script: |
          echo The journal mentions something hidden in the wine cellar...
          setquestvar %S% murder_mystery.knows_to_check_cellar true
    # Example usable lever
    - id: hidden_lever
      name: rusty lever
      article: a
      keywords:
      - lever
      - rusty
      - hidden
      weight: 0
      value: 0
      description: |
        A rusty lever protrudes from the wall, almost hidden by cobwebs.
      examine_text: |
        The lever is old and rusty, but it looks like it still works. Who knows what it might activate?
      flags:
      - no_take
      - static
      triggers:
      - id: pull_lever
        type: on_use
        script: |
          echo You pull the lever. A grinding sound echoes through the chamber!
          pause 1
          echo A hidden passage is revealed!
    - id: inn_beer
      name: mug of beer
      article: a
      description: |-
        A sturdy mug of dark ale, foaming at the rim.
        It smells faintly of roasted barley and a little too much optimism.
      keywords:
      - beer
      - ale
      - mug
