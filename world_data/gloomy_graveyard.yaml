ZONES:
  gloomy_graveyard:
    name: Gloomy Graveyard
    description: |
      A gloomy graveyard and it's surrounds, including a dark forest, a manor house, a crypt, and a inn. Recently, a dark murder has cast a shadow over the area -  Lord Ashford of the manor house was found dead in the graveyard.
    # Zone-level common knowledge - things NPCs in this zone know about
    common_knowledge:
      murder_case: |
        Lord Ashford was found murdered in the graveyard a few days ago. The gravedigger Old Tom is the prime suspect.
      village_mood: |
        Everyone is on edge since the murder. Strangers are viewed with suspicion.
      manor_history: |
        The Ashford Manor has stood for centuries. Lord Ashford was the last of his line, a wealthy but reclusive nobleman.
      old_tom_reputation: |
        Old Tom has been the gravedigger for decades. He's eccentric but harmless, or so everyone thought.
      butler_reputation: |
        Edmund the butler has served the Ashford family for twenty years. He's known as strict but utterly loyal.
      local_geography: |
        The Weary Traveler Inn sits on the forest road. The graveyard is to the north and then east from the inn. Ashford Manor is east along the forest road. The old crypts are in the southeast part of the graveyard. The forest surrounds everything - it's called the Enchanted Forest and travelers should stick to the roads.
      dismissal_note: (You haven't found any written motive yet.)
      case_solved: (You do not yet have enough evidence to name the killer.)
    quests:
      murder_mystery:
        __replace__: true
        title: The Gloomy Graveyard Murder
        description: Prove Old Tom's innocence by finding the real killer.
        objectives:
        - Investigate the graveyard for clues.
        - Get Old Tom to tell you what he saw.
        - Follow the trail to the manor and uncover the truth.
        variables:
          heard_about_murder:
            type: boolean
            default: false
            description: Heard rumors of the murder.
            knowledge_updates:
            - condition: true
              updates:
                murder_case: |-
                  Lord Ashford was found dead in the graveyard, and suspicion has fallen on Old Tom.
                  If you want the truth, you'll have to dig it up yourself.
          found_body:
            type: boolean
            default: false
            description: Discovered the victim's body.
            knowledge_updates:
            - condition: true
              updates:
                murder_case: |-
                  You found Lord Ashford's body among the graves.
                  The wound suggests a heavy blow to the back of the head.
          found_note:
            type: boolean
            default: false
            description: Found and read the torn note.
            knowledge_updates:
            - condition: true
              updates:
                dismissal_note: |-
                  A torn note found on the body suggests Lord Ashford was about to fire a long-serving employee:
                  "After twenty years of service, your position is no longer required."
                  Motive is starting to take shape.
          tom_trusts_player:
            type: boolean
            default: false
            description: Old Tom trusts you enough to talk.
            knowledge_updates:
            - condition: true
              updates:
                old_tom_reputation: |-
                  Old Tom is gruff, but he seems to believe you might actually help.
                  He may share what he knows—if you keep treating him like a person, not a suspect.
          knows_about_figure:
            type: boolean
            default: false
            description: Learned about the figure Old Tom saw.
            knowledge_updates:
            - condition: true
              updates:
                murder_case: |-
                  Old Tom claims he saw a tall, well-dressed figure coming from the manor on the night of the murder.
                  Brass buttons. A confident stride. Someone who didn't belong among the graves.
          knows_about_cufflink:
            type: boolean
            default: false
            description: Learned about the hidden cufflink.
          can_find_cufflink:
            type: boolean
            default: false
            description: Can search the shack for the cufflink.
          has_evidence:
            type: boolean
            default: false
            description: Found the monogrammed cufflink.
            knowledge_updates:
            - condition: true
              updates:
                case_solved: |-
                  You have a monogrammed cufflink as evidence.
                  Someone close to Lord Ashford—and connected to the manor—was at the scene.
          maid_trusts_player:
            type: boolean
            default: false
            description: Eliza the maid trusts you enough to help.
          suspects_butler:
            type: boolean
            default: false
            description: Suspect Edmund the butler.
            knowledge_updates:
            - condition: true
              updates:
                butler_reputation: |-
                  Edmund the butler is now a prime suspect.
                  Between the dismissal threat, manor tensions, and the evidence you've found, his "loyal service" feels like a mask.
          knows_to_check_cellar:
            type: boolean
            default: false
            description: Learned to search the wine cellar.
          found_murder_weapon:
            type: boolean
            default: false
            description: Found the bloody candlestick.
            knowledge_updates:
            - condition: true
              updates:
                murder_case: |-
                  You found a bloodstained brass candlestick hidden in the wine cellar.
                  It's heavy enough to match the wound—and it reeks of a hurried cover-up.
          ghost_spoke:
            type: boolean
            default: false
            description: Spoke with the victim's ghost.
          edmund_threatened:
            type: boolean
            default: false
            description: Edmund has been threatened or pressed hard.
          quest_complete:
            type: boolean
            default: false
            description: Solved the murder mystery.
            knowledge_updates:
            - condition: true
              updates:
                murder_case: |-
                  The murder of Lord Ashford has been solved, and Old Tom has been cleared.
                  The village can finally breathe again.
                village_mood: |-
                  Word spreads quickly: the truth came out, and the wrong man won't hang for it.
                  People still whisper, but the fear has softened into uneasy relief.
        stages:
        - name: Case closed
          sequence: 100
          description: You've done it. The truth is known, and Old Tom is no longer the village's scapegoat.
          conditions:
            murder_mystery.quest_complete: true
        - name: Present the evidence
          sequence: 90
          description: |-
            You have enough to move from suspicion to accusation.
            Bring what you've found to Maggie and make the case against Edmund.
          conditions:
            murder_mystery.found_murder_weapon: true
            murder_mystery.has_evidence: true
            murder_mystery.quest_complete:
              op: neq
              val: true
        - name: Search the wine cellar
          sequence: 80
          description: |-
            Eliza hinted that something was hidden in the manor's wine cellar.
            Search for a weapon or anything stained with blood.
          conditions:
            murder_mystery.knows_to_check_cellar: true
            murder_mystery.found_murder_weapon:
              op: neq
              val: true
            murder_mystery.quest_complete:
              op: neq
              val: true
        - name: Learn what's hidden below
          sequence: 70
          description: |-
            Someone in the manor knows more than they're saying.
            Talk to Eliza again and press her about Edmund—and about the cellar.
          conditions:
            murder_mystery.suspects_butler: true
            murder_mystery.knows_to_check_cellar:
              op: neq
              val: true
            murder_mystery.quest_complete:
              op: neq
              val: true
        - name: Follow the monogram
          sequence: 60
          description: |-
            You found a monogrammed cufflink.
            Show it to Maggie or Eliza and learn who it belongs to.
          conditions:
            murder_mystery.has_evidence: true
            murder_mystery.suspects_butler:
              op: neq
              val: true
            murder_mystery.quest_complete:
              op: neq
              val: true
        - name: Search the shack
          sequence: 50
          description: |-
            Old Tom mentioned a cufflink hidden in the shack by the graveyard entrance.
            Search it carefully.
          conditions:
            murder_mystery.can_find_cufflink: true
            murder_mystery.has_evidence:
              op: neq
              val: true
            murder_mystery.quest_complete:
              op: neq
              val: true
        - name: Earn Old Tom's trust
          sequence: 30
          description: |-
            Old Tom is the village's favorite suspect, but he might be the key to the truth.
            Talk to him at his shack and convince him you're on his side.
          conditions:
            murder_mystery.found_body: true
            murder_mystery.tom_trusts_player:
              op: neq
              val: true
            murder_mystery.quest_complete:
              op: neq
              val: true
        - name: Read the victim's note
          sequence: 40
          description: |-
            The body had a torn note clenched in its hand.
            Find it and read it—motive often hides in ink.
          conditions:
            murder_mystery.found_body: true
            murder_mystery.found_note:
              op: neq
              val: true
            murder_mystery.quest_complete:
              op: neq
              val: true
        - name: Find the body
          sequence: 20
          description: |-
            Maggie's gossip points toward the graveyard.
            Search the graves until you find where Lord Ashford fell.
          conditions:
            murder_mystery.heard_about_murder: true
            murder_mystery.found_body:
              op: neq
              val: true
            murder_mystery.quest_complete:
              op: neq
              val: true
        - name: A rumor worth chasing
          sequence: 10
          description: |-
            People are terrified—and they're blaming Old Tom.
            Start by talking to Maggie at the Weary Traveler.
          conditions:
            murder_mystery.heard_about_murder: true
            murder_mystery.quest_complete:
              op: neq
              val: true
        - name: The Voice of the Dead
          sequence: 45
          description: |-
            You spoke to the ghost of Lord Ashford.
            He spoke of "E" and a "digger." The evidence points to the graveyard entrance.
          conditions:
            murder_mystery.ghost_spoke: true
            murder_mystery.can_find_cufflink:
              op: neq
              val: true
            murder_mystery.quest_complete:
              op: neq
              val: true
    ROOMS:
      forest_road_s:
        name: South Dark Forest Road
        description: |
          A narrow, winding path shrouded in shadows, marking the southern entrance to the dark forest. The dense canopy overhead allows only slivers of moonlight to penetrate, casting eerie patterns on the ground. The air is thick with the scent of moss and damp earth. An unsettling silence pervades, broken occasionally by distant, unidentifiable sounds. To the east, the trees thin out and you can see the imposing silhouette of city walls in the distance.
          Exits: north, south, east
        exits:
          north:
            destination: forest_road_mid
            description: The path winds deeper into the dark forest, shadows growing thicker ahead.
          south:
            destination: enchanted_forest.misty_copse
            description: Through the thinning trees, you glimpse a misty copse bathed in an ethereal glow.
          east:
            destination: central_city.city_gates
            description: A well-worn trail leads eastward toward the grand gates of Central City.
        triggers:
        - id: catch_any_howl
          type: catch_any
          criteria:
          - subject: '%*%'
            operator: contains
            predicate: howl
          script: |
            echo A distant howl echoes through the trees, sending a shiver down your spine.
        - id: timer_tick_a_gust_of
          type: timer_tick
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 5
          script: |
            echo A gust of wind rustles the leaves, creating a haunting melody.
      forest_road_mid:
        name: Middle of Dark Forest Road
        description: |
          The forest road here is overgrown, the trees encroaching upon the path. Vines and brambles snag at your clothing as you pass. The darkness is more profound, the sounds of the forest more pronounced. An occasional rustle in the underbrush or a snap of a twig suggests you are not alone.
          Exits: north, south, west
        exits:
          north:
            destination: forest_road_n
          south:
            destination: forest_road_s
          west:
            destination: dark_forest_se
        triggers:
        - id: catch_any_growl
          type: catch_any
          criteria:
          - subject: '%*%'
            operator: contains
            predicate: growl
          script: |
            echo A low growl resonates from the shadows, its source unseen but unnervingly close.
        - id: catch_look_tree
          type: catch_look
          criteria:
          - subject: '%*%'
            operator: contains
            predicate: tree
          script: |
            echo The trees here are gnarled and twisted, their branches reaching out like clawed hands.
      dark_forest_se:
        name: South East Dark Forest
        description: |
          This part of the forest feels ancient and untouched. The trees are colossal, their trunks thick and covered in strange markings. The ground is uneven, littered with fallen branches and leaves. Occasionally, the eyes of small creatures reflect the moonlight, watching you from the darkness.
          Exits: north, east, west
        exits:
          north:
            destination: dark_forest_e
          east:
            destination: forest_road_mid
          west:
            destination: dark_forest_s
        triggers:
        - id: catch_any_whisper
          type: catch_any
          criteria:
          - subject: '%*%'
            operator: contains
            predicate: whisper
          script: |
            echo You hear a whispering sound, as if the trees themselves are speaking in hushed tones.
        - id: timer_tick_the_moonlight_filters
          type: timer_tick
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 10
          script: |
            echo The moonlight filters through the canopy, casting ghostly shadows that dance across your path.
      dark_forest_sw:
        name: South West Dark Forest
        description: |
          A dense, foreboding part of the forest where the trees grow so close together that they almost seem to merge into one another. The ground is spongy underfoot, covered in a thick layer of decaying leaves and moss. The air is damp and heavy, carrying a faint, musty odor. Occasional patches of moonlight reveal gnarled roots and twisting vines that seem to grasp at your feet.
          Exits: north, east
        exits:
          north:
            destination: dark_forest_w
          east:
            destination: dark_forest_s
        characters:
        - id: werewolf
          quantity: 1
          respawn time min: 30
          respawn time max: 90
        triggers:
        - id: catch_any_rustle
          type: catch_any
          criteria:
          - subject: '%*%'
            operator: contains
            predicate: rustle
          script: |
            echo A rustling noise comes from nearby bushes, but the source remains hidden in the shadows.
        - id: timer_tick_a_mysterious_fog
          type: timer_tick
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 15
          script: |
            echo A mysterious fog begins to rise from the ground, enveloping the area in a ghostly veil.
      dark_forest_w:
        name: West Dark Forest
        description: |
          This part of the forest feels more wild and untamed. The trees are older, their bark rough and covered in lichen. The path is barely visible, obscured by overgrowth. The sounds of the forest are louder here, a symphony of nocturnal creatures. The darkness seems to thicken, making it difficult to see far ahead.
          Exits: north, south, east
        exits:
          north:
            destination: dark_forest_nw
          south:
            destination: dark_forest_sw
          east:
            destination: dark_forest_mid
        characters:
        - id: werewolf
          quantity: 1
          respawn time min: 30
          respawn time max: 90
        triggers:
        - id: catch_any_howl_2
          type: catch_any
          criteria:
          - subject: '%*%'
            operator: contains
            predicate: howl
          script: |
            echo A haunting howl pierces the night air, closer now than before, its origin chillingly unclear.
        - id: timer_tick_shadows_move_and
          type: timer_tick
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 20
          script: |
            echo Shadows move and twist around you, as if alive, casting an eerie gloom over the forest.
      dark_forest_nw:
        name: North West Dark Forest
        description: |
          The trees here are so tall they seem to touch the sky, their leaves forming a dense canopy above. The path is rocky and uneven, making travel treacherous. The deeper parts of the forest are shrouded in an almost impenetrable darkness. The air is colder here, and every sound seems amplified, echoing through the trees.
          Exits: south, east
        exits:
          south:
            destination: dark_forest_w
          east:
            destination: dark_forest_n
        characters:
        - id: werewolf
          quantity: 1
          respawn time min: 30
          respawn time max: 90
        triggers:
        - id: catch_any_growl_2
          type: catch_any
          criteria:
          - subject: '%*%'
            operator: contains
            predicate: growl
          script: |
            echo A deep, guttural growl resonates from the darkness, sending a wave of unease through the air.
        - id: timer_tick_the_moonlight_struggles
          type: timer_tick
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 25
          script: |
            echo The moonlight struggles to penetrate the dense foliage, creating a haunting and otherworldly atmosphere.
      dark_forest_s:
        name: South Dark Forest
        description: |
          A shadowy expanse of the forest where the trees are less dense but taller, creating long, dark shadows that stretch across the forest floor. The path here is clearer but twists unpredictably, leading deeper into the heart of the forest. The air is filled with the scent of pine and the distant sound of running water.
          Exits: north, east, west
        exits:
          north:
            destination: dark_forest_mid
          east:
            destination: dark_forest_se
          west:
            destination: dark_forest_sw
        characters:
        - id: werewolf
          quantity: 1
          respawn time min: 30
          respawn time max: 90
        triggers:
        - id: catch_any_whistle
          type: catch_any
          criteria:
          - subject: '%*%'
            operator: contains
            predicate: whistle
          script: |
            echo A soft, eerie whistle drifts through the trees, its source impossible to pinpoint.
        - id: timer_tick_the_leaves_rustle
          type: timer_tick
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 30
          script: |
            echo The leaves rustle as if whispering secrets to each other, creating an unsettling chorus.
      dark_forest_mid:
        name: Middle of Dark Forest
        description: |
          The heart of the dark forest, where the sense of age and mystery is palpable. The trees here are ancient and massive, their branches forming a dense network above. The ground is uneven, with roots snaking across the path. The forest seems alive, its sounds and movements suggesting a watchful presence.
          Exits: north, south, east, west
        exits:
          north:
            destination: dark_forest_n
          south:
            destination: dark_forest_s
          east:
            destination: dark_forest_e
          west:
            destination: dark_forest_w
        characters:
        - id: werewolf
          quantity: 1
          respawn time min: 30
          respawn time max: 90
        triggers:
        - id: catch_any_scream
          type: catch_any
          criteria:
          - subject: '%*%'
            operator: contains
            predicate: scream
          script: |
            echo A sudden, blood-curdling scream shatters the silence, causing the hairs on the back of your neck to stand up.
        - id: timer_tick_a_mysterious_faint
          type: timer_tick
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 35
          script: |
            echo A mysterious, faint light appears and disappears between the trees, like will-o'-the-wisps leading you further into the forest.
      dark_forest_n:
        name: North Dark Forest
        description: |
          A dense, almost impenetrable part of the forest where the trees grow close together, their leaves forming a thick canopy that blocks out most of the light. The air is cool and damp, filled with the sounds of creaking branches and the occasional distant howl. The path is barely visible, covered in a thick layer of leaves and debris.
          Exits: south, east, west
        exits:
          south:
            destination: dark_forest_mid
          east:
            destination: dark_forest_ne
          west:
            destination: dark_forest_nw
        characters:
        - id: werewolf
          quantity: 1
          respawn time min: 30
          respawn time max: 90
        triggers:
        - id: catch_any_growl_3
          type: catch_any
          criteria:
          - subject: '%*%'
            operator: contains
            predicate: growl
          script: |
            echo A low, menacing growl echoes through the trees, its source obscured by the dense undergrowth.
        - id: timer_tick_shadows_move
          type: timer_tick
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 40
          script: |
            echo The shadows seem to move and shift around you, as if they were alive and watching your every step.
      dark_forest_e:
        name: East Dark Forest
        description: |
          The eastern region of the forest is marked by a gradual rise in terrain, leading towards a series of small, rocky hills. The trees here are thinner, allowing more moonlight to filter through, casting a silvery glow on the forest floor. The path is lined with small, delicate flowers that seem to glow faintly in the dark. The atmosphere is quieter, but the sense of being watched remains.
          Exits: north, south, west
        exits:
          north:
            destination: dark_forest_ne
          south:
            destination: dark_forest_se
          west:
            destination: dark_forest_mid
        characters:
        - id: werewolf
          quantity: 1
          respawn time min: 30
          respawn time max: 90
        triggers:
        - id: catch_any_rustling
          type: catch_any
          criteria:
          - subject: '%*%'
            operator: contains
            predicate: rustling
          script: |
            echo A sudden rustling in the underbrush nearby causes you to pause, your heart racing.
        - id: timer_tick_the_moon_casts
          type: timer_tick
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 45
          script: |
            echo The moon casts long, slender shadows between the trees, creating an almost ethereal landscape.
      dark_forest_ne:
        name: North East Dark Forest
        description: |
          This part of the forest feels more wild and untamed. The trees are closely packed, their branches intertwining to form a dense canopy overhead. The path is narrow and treacherous, winding through thick underbrush and overgrown roots. The air is filled with the sound of rustling leaves and the occasional distant howl.
          Exits: south, west
        exits:
          south:
            destination: dark_forest_e
          west:
            destination: dark_forest_n
        characters:
        - id: werewolf
          quantity: 1
          respawn time min: 30
          respawn time max: 90
        triggers:
        - id: catch_any_howl_3
          type: catch_any
          criteria:
          - subject: '%*%'
            operator: contains
            predicate: howl
          script: |
            echo An eerie howl resonates through the forest, long and mournful, sending chills down your spine.
        - id: timer_tick_shadows_dance_across
          type: timer_tick
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 50
          script: |
            echo Shadows dance across your path, as if playing tricks with your eyes in the dim moonlight.
      forest_road_n:
        name: North Dark Forest Road
        description: |
          The forest road here begins to widen as it approaches the edge of the graveyard. Old, gnarled trees line the path, their branches like twisted hands reaching towards the sky. A chill breeze whispers through the leaves, carrying a hint of decay. The graveyard's wrought iron gates loom in the distance, while a cozy looking inn sits invitingly to the east, its windows glowing with warm light. To the north, a dusty trail climbs toward barren hills where the trees grow thin and sparse.
          Exits: north, south, east, west
        exits:
          north:
            destination: forest_northern_edge
            description: A dusty trail leads north toward the barren hills where trees grow sparse.
          south:
            destination: forest_road_mid
          east:
            destination: inn_common_room
          west:
            destination: graveyard_road_e
        triggers:
        - id: catch_any_whisper_2
          type: catch_any
          criteria:
          - subject: '%*%'
            operator: contains
            predicate: whisper
          script: |
            echo Hushed whispers seem to drift through the trees, though their source remains unseen.
        - id: timer_tick_a_cold_gust
          type: timer_tick
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 55
          script: |
            echo A cold gust of wind blows down the road, rustling leaves and stirring up small whirlwinds of dust.
      forest_northern_edge:
        name: Northern Edge of the Forest
        description: |
          The forest thins dramatically here as the land rises toward barren, sun-bleached hills. Gnarled trees give way to scraggly brush and wind-twisted shrubs. The soil underfoot transitions from dark loam to pale, dusty earth. The air grows noticeably drier, carrying hints of distant heat rather than forest decay. A well-worn trail continues north, climbing toward increasingly arid terrain.
          Exits: north, south
        flags:
        - outdoors
        exits:
          north:
            destination: arid_borderlands
            description: The trail climbs north through increasingly barren terrain.
          south:
            destination: forest_road_n
            description: The path descends back toward the dark forest and the road.
        triggers:
        - id: northern_edge_wind
          type: timer_tick
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 40
          - subject: $random(1,100)
            operator: numlte
            predicate: 30
          script: |
            echo A dry wind sweeps down from the barren hills, rustling the dying brush.
        - id: northern_edge_first_visit
          type: on_enter
          criteria:
          - subject: $permvar(%S%, visited_forest_northern_edge)
            operator: '!='
            predicate: 'true'
          script: |
            setpermvar char %S% visited_forest_northern_edge true
            echo The change in terrain is striking - the lush darkness of the forest gives way to pale, sun-scorched earth.
      arid_borderlands:
        name: Arid Borderlands
        description: |
          This windswept stretch of barren terrain marks the boundary between the forested lowlands and the great desert beyond. Only the hardiest vegetation survives here - thorny scrub and sun-bleached grasses that crackle underfoot. To the north, the land flattens into an expanse of sand and heat-shimmered air. Ancient stone markers, half-buried in drifted sand, line what was once a proper road.
          Exits: north, south
        flags:
        - outdoors
        - hot
        exits:
          north:
            destination: shattered_dominion.room_desert_southern_trail
            description: The path continues north into the desert wastes.
          south:
            destination: forest_northern_edge
            description: The trail descends south toward the edge of the forest.
        triggers:
        - id: borderlands_heat
          type: timer_tick
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 35
          - subject: $random(1,100)
            operator: numlte
            predicate: 35
