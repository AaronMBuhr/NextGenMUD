      rough_hewn_tunnel_deep:
        subzone: citadel_approach
        name: Deep Tunnel Junction
        description: |
          The tunnel levels out here in a small, roughly circular chamber. Tool marks  cover every surface, testament to the backbreaking labor required to carve  this space from solid rock. A rusted iron brazier sits cold and dead in the  center—evidence that the diggers once rested here during their secret work.  Discarded pick handles and broken tool heads litter the floor. The air is  heavy with an ancient, mineral smell, tinged with something else... the  unmistakable tang of salt water. The tunnel continues south, and you can  feel a faint vibration in the stone, as if vast machinery operates somewhere  in the distance.
          Exits: north, south
        exits:
          north:
            destination: rough_hewn_tunnel_descent
          south:
            destination: rough_hewn_tunnel_citadel_approach
