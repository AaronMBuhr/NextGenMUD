      rough_hewn_tunnel_citadel_approach:
        subzone: citadel_approach
        name: Tunnel's End - Ancient Foundation
        description: |
          The rough-hewn tunnel terminates here against a wall of worked stone utterly  unlike the crude excavation behind you. This is ancient masonry of exceptional  quality—massive basalt blocks fitted together with mathematical precision,  their surfaces etched with faded geometric patterns. A ragged breach has been  carved through this wall, the crude chisel marks a stark violation of the  elegant construction. Beyond the breach, you glimpse chambers of polished  stone and brass fittings. The air here carries a strange, electric quality,  and you can feel pressure against your ears as if you've descended to a  great depth. The rhythmic pulse of hidden machinery is stronger here,  accompanied by the distant hiss of steam.
          Exits: north, east
        exits:
          north:
            destination: rough_hewn_tunnel_deep
          east:
            destination: sunken_citadel.breach_chamber
