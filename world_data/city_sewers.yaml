          - id: catch_look_bat
            type: catch_inspect
            criteria: 
              - subject: "%{*}"
                operator: contains
                predicate: "bat"
            script: |
              echo As you peer into the darkness, you see a pair of enormous, glowing eyes staring back at you. They blink once, then vanish.
          - id: on_any_climb
            type: on_see
            criteria: 
              - subject: "%{*}"
                operator: contains
                predicate: "climb"
