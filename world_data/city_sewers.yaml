ZONES:
  city_sewers:
    name: City Sewers
    description: The dank and filthy sewers of the imperial city. The stench is unbearable.
    ROOMS:
      sewer_entrance:
        subzone: upper_works
        name: Sewer Entrance
        description: |
          You stand at the entrance to the Imperial City's vast sewer system. A large,  circular stone archway looms before you, its edges slick with moisture and  adorned with moss. The pungent odor of waste and stagnant water assaults your  nostrils. Flickering torches mounted on the walls cast eerie shadows, revealing  glimpses of the dank passageways that stretch into the darkness below.  Occasional echoes of dripping water and scurrying creatures reach your ears,  hinting at the challenges that await in the depths.
          Exits: down, out
        exits:
          down:
            destination: main_junction
          out:
            destination: imperial_city.sewers_entrance
        triggers:
        - id: timer_tick_sewer_entrance_1
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 15
          script: |  # Corrected indentation
            echo A gust of foul air wafts up from the depths, carrying the unmistakable stench of the sewers.
        - id: timer_tick_sewer_entrance_2
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 20
          - subject: $random(1,100)
            operator: numlte
            predicate: 30
          script: |  # Corrected indentation
            echo The distant sound of rushing water echoes from deep within the sewer system.
        - id: catch_look_torch
          type: catch_inspect  # Corrected indentation
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: torch
          script: |  # Corrected indentation
            echo The torch flickers weakly, its flame struggling against the damp air of the sewers.
        - id: on_any_smell
          type: on_see
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: smell
          script: |  # Corrected indentation
            echo You instantly regret trying to smell anything here. The stench is overwhelming.
        - id: on_say_hello
          type: on_say
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: hello
          script: |  # Corrected indentation
            echo Your voice echoes ominously through the sewer entrance, but only silence answers back.
        characters:
        - id: giant_rat
          quantity: 2
          respawn time min: 20
          respawn time max: 60
        - id: giant_roach
          quantity: 1
          respawn time min: 30
          respawn time max: 90
        - id: giant_leech
          quantity: 1
          respawn time min: 45
          respawn time max: 120
      main_junction:
        subzone: central_conduits
        name: Main Sewer Junction
        description: |
          You find yourself in a vast, circular chamber that serves as the main junction  for the Imperial City's sewer system. Massive stone pillars, slick with moisture  and adorned with patches of phosphorescent fungi, support the vaulted ceiling  high above. Multiple tunnels branch out in all directions, their dark mouths  gaping like hungry beasts. The air is thick with the stench of decay and the  constant sound of rushing water. Channels of murky, foul-smelling liquid  converge in the center of the room, forming a swirling whirlpool that  disappears into an ominous drain.
          Exits: up, north, south, east, west
        exits:
          up:
            destination: sewer_entrance
          north:
            destination: northern_tunnel
          south:
            destination: southern_tunnel
          east:
            destination: eastern_tunnel
          west:
            destination: western_tunnel
        triggers:
        - id: timer_tick_main_junction_1
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 15
          script: |  # Corrected indentation
            echo The sound of rushing water grows momentarily louder, echoing off the chamber walls.
        - id: timer_tick_main_junction_2
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 20
          - subject: $random(1,100)
            operator: numlte
            predicate: 25
          script: |  # Corrected indentation
            echo A piece of unidentifiable debris floats by in one of the water channels, quickly disappearing into the central whirlpool.
        - id: catch_look_fungi
          type: catch_inspect  # Corrected indentation
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: fungi
          script: |  # Corrected indentation
            echo The phosphorescent fungi glow with an eerie, pale blue light, providing just enough illumination to navigate the chamber.
        - id: on_any_sewer_swim
          type: on_see
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: swim
          script: |  # Corrected indentation
            echo Swimming in these foul waters would be extremely unwise and potentially deadly.
        - id: on_say_sewer_echo
          type: on_say
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: echo
          script: |  # Corrected indentation
            $if($random(1,2),eq,1) {
              echo Your words echo back at you, distorted and haunting in the vast chamber.
            } else {
              echo The echoes of your voice seem to awaken something in the shadows. You hear a distant skittering sound.
            }
        characters:
        - id: giant_rat
          quantity: 3
          respawn time min: 15
          respawn time max: 45
        - id: slime
          quantity: 2
          respawn time min: 30
          respawn time max: 90
        - id: giant_leech
          quantity: 1
          respawn time min: 45
          respawn time max: 120
      northern_tunnel:
        subzone: northern_conduits
        name: Northern Sewer Tunnel
        description: |
          You find yourself in a long, arched tunnel stretching northward into the gloom.  The walls, made of ancient stonework, are slick with moisture and patches of  slimy growth. Brackish water flows sluggishly through a central channel, carrying  with it an assortment of refuse and detritus. Rusty iron brackets hold sputtering  torches at irregular intervals, casting flickering shadows that dance across the  curved ceiling. The air is thick with the musty odor of decay and stagnant water.  Occasionally, you hear the distant splash of unseen creatures moving through the  murky depths.
          Exits: south, north
        exits:
          south:
            destination: main_junction
          north:
            destination: waste_processing_chamber
        triggers:
        - id: timer_tick_northern_tunnel_1
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 18
          script: |  # Corrected indentation
            echo A cold draft whistles through the tunnel, carrying with it the echoes of distant dripping water.
        - id: timer_tick_northern_tunnel_2
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 25
          - subject: $random(1,100)
            operator: numlte
            predicate: 30
          script: |  # Corrected indentation
            echo Something large splashes in the water channel, momentarily disturbing the sluggish flow.
        - id: catch_look_torch
          type: catch_inspect  # Corrected indentation
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: torch
          script: |  # Corrected indentation
            echo The torch flickers weakly, its flame struggling against the damp air. The rusted bracket holding it looks ready to give way at any moment.
        - id: on_any_sewer_drink
          type: on_see
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: drink
          script: |  # Corrected indentation
            echo The very thought of drinking this foul water turns your stomach. It would be extremely unwise and potentially deadly.
        - id: on_say_hello
          type: on_say
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: hello
          script: |  # Corrected indentation
            echo Your greeting echoes down the tunnel, fading into an eerie silence. Then, from somewhere in the darkness, you hear what sounds like a faint, mocking echo of your voice.
        characters:
        - id: giant_rat
          quantity: 2
          respawn time min: 20
          respawn time max: 60
        - id: giant_leech
          quantity: 1
          respawn time min: 40
          respawn time max: 100
        - id: slime
          quantity: 1
          respawn time min: 30
          respawn time max: 90
      waste_processing_chamber:
        subzone: industrial_sector
        name: Waste Processing Chamber
        description: |
          You enter a large, circular chamber that serves as a primitive waste processing  area for the Imperial City's sewage system. The air is thick with noxious fumes  and the unmistakable stench of decay. Massive stone grinders, powered by an  unseen water wheel, churn slowly in the center of the room, breaking down solid  waste. Channels of murky water feed into and out of the chamber through grated  openings. The walls are lined with crude stone shelves holding an assortment of  alchemical mixtures in clay jars - presumably used to treat the waste. Sputtering  torches cast an eerie, green-tinged light, reflecting off the slime-coated surfaces.  The constant grinding noise and gurgling of water creates a cacophony that echoes  throughout the chamber.
          Exits: south, east, west
        exits:
          south:
            destination: northern_tunnel
          east:
            destination: filtration_room
          west:
            destination: sludge_pit
        triggers:
        - id: timer_tick_waste_processing_chamber_1
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 20
          script: |  # Corrected indentation
            echo The grinding stones emit a loud groan as they crush a particularly large piece of debris.
        - id: timer_tick_waste_processing_chamber_2
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 30
          - subject: $random(1,100)
            operator: numlte
            predicate: 25
          script: |  # Corrected indentation
            echo A burst of foul gas erupts from one of the water channels, causing you to gag momentarily.
        - id: catch_look_jar
          type: catch_inspect  # Corrected indentation
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: jar
          script: |  # Corrected indentation
            echo The clay jars are labeled with crude symbols. You recognize some as basic alchemical notations for acids and bases.
        - id: on_any_sewer_touch
          type: on_see
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: touch
          script: |  # Corrected indentation
            echo You think better of touching anything in this foul chamber. Who knows what diseases lurk in the waste?
        - id: on_say_help
          type: on_say
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: help
          script: |  # Corrected indentation
            echo Your cry for help is drowned out by the grinding of stones and rushing of water. If anyone heard you, they gave no sign.
        characters:
        - id: giant_rat
          quantity: 3
          respawn time min: 15
          respawn time max: 45
        - id: slime
          quantity: 2
          respawn time min: 30
          respawn time max: 90
        - id: giant_leech
          quantity: 1
          respawn time min: 45
          respawn time max: 120
      filtration_room:
        subzone: industrial_sector
        name: Filtration Room
        description: |
          You enter a long, rectangular chamber that appears to be a crude attempt at  water filtration. The room is dominated by a series of large, tiered stone  basins filled with layers of sand, gravel, and charcoal. Murky water trickles  down from one basin to the next, gradually becoming clearer, though still far  from pure. The walls are lined with racks of clay pots containing various  mineral salts and powders used in the filtration process. The air is thick  with humidity and the pungent smell of algae and mineral deposits. Guttering  torches cast a wavering light, revealing patches of bioluminescent mold growing  in the darker corners. The constant sound of trickling water echoes off the  stone walls, occasionally punctuated by the drip of water from the vaulted ceiling.
          Exits: west, down
        exits:
          west:
            destination: waste_processing_chamber
          down:
            destination: underground_stream
        triggers:
        - id: timer_tick_filtration_room_1
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 20
          script: |  # Corrected indentation
            echo A large bubble rises to the surface of one of the basins and bursts, releasing a brief whiff of sulfur.
        - id: timer_tick_filtration_room_2
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 30
          - subject: $random(1,100)
            operator: numlte
            predicate: 25
          script: |  # Corrected indentation
            echo You hear a muffled splash from the underground stream below, followed by an unsettling gurgling sound.
        - id: catch_look_basin
          type: catch_inspect  # Corrected indentation
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: basin
          script: |  # Corrected indentation
            echo As you peer into the basin, you notice small, pale creatures darting between the layers of filtration material.
        - id: on_any_sewer_drink
          type: on_see
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: drink
          script: |  # Corrected indentation
            echo Despite the filtration process, this water is still far from safe to drink. The thought alone makes your stomach churn.
        - id: on_say_hello
          type: on_say
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: hello
          script: |  # Corrected indentation
            echo Your voice echoes strangely in the humid air, distorted by the constant sound of trickling water.
        characters:
        - id: giant_frog
          quantity: 2
          respawn time min: 30
          respawn time max: 90
        - id: slime
          quantity: 1
          respawn time min: 40
          respawn time max: 100
        - id: giant_leech
          quantity: 1
          respawn time min: 50
          respawn time max: 120
      sludge_pit:
        subzone: industrial_sector
        name: Sludge Pit
        description: |
          You find yourself at the edge of a vast, circular pit filled with a thick,  bubbling morass of sludge and waste. The stench here is overwhelming, a miasma  of decay and noxious gases that burns your nostrils and makes your eyes water.  The walls of the pit are slick with a greenish-black slime, and narrow walkways  of ancient stone circle the edge, their surfaces treacherously slippery.  Occasional geysers of gas erupt from the sludge, releasing clouds of foul vapor.  Dim, sickly green light emanates from patches of bioluminescent fungi clinging  to the walls, casting eerie shadows across the roiling surface of the pit. The  constant gurgle and squelch of the sludge creates a nauseating backdrop of sound.
          Exits: east, down
        exits:
          east:
            destination: waste_processing_chamber
          down:
            destination: muck_cavern
        triggers:
        - id: timer_tick_sludge_pit_1
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 15
          script: |  # Corrected indentation
            echo A large bubble swells on the surface of the sludge before bursting with a sickening 'plop', releasing a cloud of foul gas.
        - id: timer_tick_sludge_pit_2
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 25
          - subject: $random(1,100)
            operator: numlte
            predicate: 30
          script: |  # Corrected indentation
            echo Something large and unseen moves beneath the surface of the sludge, creating a series of ripples that lap at the edges of the pit.
        - id: catch_look_fungi
          type: catch_inspect  # Corrected indentation
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: fungi
          script: |  # Corrected indentation
            echo The bioluminescent fungi pulsate slowly, their eerie green light seeming to throb in time with the bubbling of the sludge.
        - id: on_any_jump
          type: on_see
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: jump
          script: |  # Corrected indentation
            echo The thought of jumping into the sludge pit fills you with dread. It would surely mean a quick and unpleasant death.
        - id: on_say_help
          type: on_say
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: help
          script: |  # Corrected indentation
            echo Your cry for help is swallowed by the gurgling of the sludge. If anything heard you, it's probably not something you'd want to come to your aid.
        characters:
        - id: giant_leech
          quantity: 2
          respawn time min: 30
          respawn time max: 90
        - id: slime
          quantity: 3
          respawn time min: 20
          respawn time max: 60
        - id: giant_frog
          quantity: 1
          respawn time min: 45
          respawn time max: 120
      underground_stream:
        subzone: natural_caverns
        name: Underground Stream
        description: |
          You find yourself in a long, winding cavern carved out by an underground stream.  The air here is cooler and less fetid than in the upper sewers, with a damp,  earthy smell. The stream, surprisingly clear compared to the foul waters above,  rushes along a deep channel cut into the cavern floor. Worn stone paths line  both sides of the stream, their surfaces slick with moisture. The walls of the  cavern glitter with tiny crystals and veins of mineral deposits, catching and  reflecting the light from your torch. Patches of luminescent moss add a soft,  blue-green glow to the darker recesses. The constant sound of rushing water  echoes off the stone walls, occasionally punctuated by the splash of unseen  creatures in the stream.
          Exits: up, east
        exits:
          up:
            destination: filtration_room
          east:
            destination: waterfall_chamber
        triggers:
        - id: timer_tick_underground_stream_1
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 20
          script: |  # Corrected indentation
            echo A school of pale, eyeless fish suddenly darts past in the stream, their scales glinting in the dim light.
        - id: timer_tick_underground_stream_2
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 30
          - subject: $random(1,100)
            operator: numlte
            predicate: 25
          script: |  # Corrected indentation
            echo A cool breeze wafts through the cavern, carrying with it the distant sound of falling water.
        - id: catch_look_crystal
          type: catch_inspect  # Corrected indentation
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: crystal
          script: |  # Corrected indentation
            echo As you examine the crystals more closely, you notice they seem to pulse faintly with an inner light.
        - id: on_any_sewer_drink
          type: on_see
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: drink
          script: |  # Corrected indentation
            echo While the water looks clearer here, drinking from an unknown underground source could still be dangerous.
        - id: on_say_hello
          type: on_say
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: hello
          script: |  # Corrected indentation
            echo Your voice echoes off the cavern walls, mixing with the sound of rushing water in an eerie chorus.
        characters:
        - id: giant_frog
          quantity: 2
          respawn time min: 30
          respawn time max: 90
        - id: giant_leech
          quantity: 1
          respawn time min: 45
          respawn time max: 120
        - id: giant_crayfish
          quantity: 1
          respawn time min: 60
          respawn time max: 150
      muck_cavern:
        subzone: natural_caverns
        name: Muck-Filled Cavern
        description: |
          You stand at the edge of a vast, natural cavern that has become a repository for  the city's foulest waste. The floor is a treacherous expanse of deep, sticky muck  that bubbles and shifts ominously. Tendrils of noxious vapor rise from the surface,  creating a hazy, sickly atmosphere. The cavern walls, barely visible through the  miasma, are coated with a slick, iridescent film that glistens in the dim light.  Sparse patches of sickly, mutated fungi cling to the higher portions of the walls,  providing meager illumination with their pale, unhealthy glow. The air is thick  with the overpowering stench of decay and the muffled sounds of things moving  beneath the muck's surface.
          Exits: up, east
        exits:
          up:
            destination: sludge_pit
          east:
            destination: fungal_grove
        triggers:
        - id: timer_tick_muck_cavern_1
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 15
          script: |  # Corrected indentation
            echo A large bubble swells and bursts in the muck, releasing a cloud of foul gas that momentarily thickens the air.
        - id: timer_tick_muck_cavern_2
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 25
          - subject: $random(1,100)
            operator: numlte
            predicate: 30
          script: |  # Corrected indentation
            echo Something large and unseen moves beneath the surface of the muck, creating ripples that spread across the cavern floor.
        - id: catch_look_fungi
          type: catch_inspect  # Corrected indentation
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: fungi
          script: |  # Corrected indentation
            echo The mutated fungi seem to recoil as you look at them, their sickly glow flickering erratically.
        - id: on_any_sewer_swim
          type: on_see
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: swim
          script: |  # Corrected indentation
            echo The very thought of swimming in this muck fills you with revulsion. It would be incredibly dangerous and likely fatal.
        - id: on_say_help
          type: on_say
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: help
          script: |  # Corrected indentation
            echo Your cry for help is muffled by the thick, foul air. Only the burbling muck seems to answer, mockingly.
        characters:
        - id: giant_leech
          quantity: 2
          respawn time min: 30
          respawn time max: 90
        - id: slime
          quantity: 3
          respawn time min: 20
          respawn time max: 60
        - id: muck_beast
          quantity: 1
          respawn time min: 60
          respawn time max: 180
      waterfall_chamber:
        subzone: natural_caverns
        name: Sewer Waterfall Chamber
        description: |
          You enter a massive, cathedral-like cavern dominated by a thundering waterfall.  The water, a mix of the clearer underground stream and the fouler sewage from  above, cascades down a jagged rock face, creating a constant mist that fills  the air. The floor is a series of tiered pools, each slightly cleaner than the  last as the water's movement provides a natural filtration. Phosphorescent  algae cling to the wet walls, bathing the chamber in an eerie, blue-green glow.  The roar of the falling water is deafening, yet underneath you can hear the  gurgle of unseen underground streams. A narrow, slippery ledge hugs the wall,  offering precarious passage around the chamber.
          Exits: west, down
        exits:
          west:
            destination: underground_stream
          down:
            destination: whirlpool_room
        triggers:
        - id: timer_tick_waterfall_chamber_1
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 20
          script: |  # Corrected indentation
            echo A sudden surge in the waterfall's flow sends a spray of mist across the chamber, momentarily obscuring your vision.
        - id: timer_tick_waterfall_chamber_2
          type: timer_tick
          flags:
          - only_when_pc_room
          criteria:
          - subject: '%time_elapsed%'
            operator: numgte
            predicate: 30
          - subject: $random(1,100)
            operator: numlte
            predicate: 25
          script: |  # Corrected indentation
            echo You glimpse a large, pale fish leaping up the tiered pools, struggling against the current.
        - id: catch_look_algae
          type: catch_inspect  # Corrected indentation
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: algae
          script: |  # Corrected indentation
            echo As you examine the phosphorescent algae, its glow intensifies, creating mesmerizing patterns on the wet stone.
        - id: on_any_sewer_swim
          type: on_see
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: swim
          script: |  # Corrected indentation
            echo Swimming here would be extremely dangerous. The current looks strong enough to sweep you over the edge to the chambers below.
        - id: on_say_sewer_echo
          type: on_say
          criteria:
          - subject: '%{*}'
            operator: contains
            predicate: echo
          script: |  # Corrected indentation
            $if($random(1,2),eq,1) {
              echo You shout, but your voice is completely drowned out by the roar of the waterfall.
            } else {
              echo Your voice echoes strangely, seeming to come from all directions at once before fading into the waterfall's roar.
            }
        characters:
        - id: giant_frog
          quantity: 2
          respawn time min: 30
          respawn time max: 90
        - id: cave_fish
          quantity: 3
          respawn time min: 20
          respawn time max: 60
        - id: water_elemental
          quantity: 1
          respawn time min: 60
          respawn time max: 180
      fungal_grove:
        subzone: natural_caverns
        name: Bioluminescent Fungal Grove
        description: |
