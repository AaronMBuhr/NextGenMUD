      rough_hewn_tunnel_descent:
        subzone: citadel_approach
        name: Descending Tunnel
        description: |
          The rough-hewn tunnel plunges deeper into the earth at a steep angle. Crude  steps have been hacked into the stone floor to prevent slipping, their edges  worn smooth by the passage of many feet over countless years. The walls here  are scored with deeper gouges, as if the diggers encountered harder rock and  had to work with greater force. Patches of phosphorescent lichen cling to the  ceiling, providing just enough ghostly illumination to see by. The temperature  continues to drop, and the briny scent grows stronger. You sense you are  approaching something ancient and vast.
          Exits: north, south
        exits:
          north:
            destination: rough_hewn_tunnel_entrance
