      rough_hewn_tunnel_entrance:
        subzone: citadel_approach
        name: Rough-Hewn Tunnel Entrance
        description: |
          The sewer walls give way here to raw, unworked stone. A crude tunnel has been  carved into the bedrock, its walls bearing the unmistakable marks of pickaxes  and chisels. The workmanship is hasty but effective—this passage was clearly  excavated in secret, away from prying eyes. The floor slopes gradually downward,  and the air grows noticeably drier as you leave the fetid moisture of the sewers  behind. Faded chalk markings on the walls might once have served as navigation  aids for those who dug this forbidden path. The tunnel stretches south into  impenetrable darkness.
          Exits: north, south
        exits:
          north:
            destination: mutant_lair
          south:
            destination: rough_hewn_tunnel_descent
        triggers:
        - id: timer_tick_tunnel_entrance_1
