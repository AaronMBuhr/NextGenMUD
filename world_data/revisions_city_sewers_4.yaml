ZONES:
  city_sewers:
    CHARACTERS:
      - id: water_elemental
        triggers:
          - id: water_elemental_crash
            type: on_attacked
            script: |
              echo The foul water elemental violently surges, sending a wave of toxic sludge crashing against the walls!

      - id: vortex_spirit
        triggers:
          - id: vortex_spin
            type: timer_tick
            flags: [only_when_pc_room]
            criteria:
              - subject: "$random(1,10)"
                operator: eq
                predicate: "1"
            script: |
              echo The swirling vortex spirit spins rapidly, the rushing water creating a dangerous, localized whirlpool.

      - id: steam_sprite
        triggers:
          - id: steam_sprite_scald
            type: on_attacked
            script: |
              echo The steam sprite hisses furiously, venting a blinding cloud of superheated vapor!

      - id: gear_golem
        triggers:
          - id: golem_clank
            type: timer_tick
            flags: [only_when_pc_room]
            criteria:
              - subject: "$random(1,10)"
                operator: eq
                predicate: "1"
            script: |
              echo The rusted gear golem grinds heavily, its corroded internal mechanisms protesting with a loud, metallic shriek.
          - id: golem_attacked
            type: on_attacked
            script: |
              echo Sparks fly from the gear golem's rusted plating as it blindly calculates its counterattack!

      - id: sound_elemental
        triggers:
          - id: sound_elemental_echo
            type: on_attacked
            script: |
              echo The compressed sonic energy of the elemental shudders, emitting a deafening, localized boom!

      - id: whispering_shade
        triggers:
          - id: shade_murmur
            type: timer_tick
            flags: [only_when_pc_room]
            criteria:
              - subject: "$random(1,12)"
                operator: eq
                predicate: "1"
            script: |
              echo A freezing chill fills the air as the whispering shade mutters forgotten secrets just on the edge of hearing.
          - id: shade_react_speech
            type: on_say
            criteria:
              - subject: "%*%"
                operator: neq
                predicate: ""
            script: |
              echo The whispering shade drifts slightly closer, its smoky form drawn to the warmth of a living voice.

      - id: whisper_sprite
        triggers:
          - id: whisper_sprite_ping
            type: on_attacked
            script: |
              echo The malicious whisper sprite darts erratically, releasing a sharp, disorienting ping of sonic energy!

      - id: illusory_guardian
        triggers:
          - id: guardian_shimmer
            type: on_attacked
            script: |
              echo The shimmering illusory guardian flickers violently, the magical ward sustaining it flaring with bright, blinding light!

      - id: chaos_wisp
        triggers:
          - id: chaos_wisp_spark
            type: timer_tick
            flags: [only_when_pc_room]
            criteria:
              - subject: "$random(1,10)"
                operator: eq
                predicate: "1"
            script: |
              echo The flickering chaos wisp arcs across the ceiling, shedding sparks of unstable arcane energy into the dark water below.