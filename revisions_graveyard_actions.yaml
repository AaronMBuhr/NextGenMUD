# Fixes for Quest Logic, Variable Standardization, and Hidden Items

ZONES:
  gloomy_graveyard:
    # 1. Update the Quest Definition to include the Ghost stage and ensure robustness
    quests:
      murder_mystery:
        stages:
          # Insert a new stage for the Ghost interaction (Sequence 45 fits between Reading Note and Searching Shack)
          - name: The Voice of the Dead
            sequence: 45
            description: |-
              You spoke to the ghost of Lord Ashford.
              He spoke of "E" and a "digger." The evidence points to the graveyard entrance.
            conditions:
              murder_mystery.ghost_spoke: true
              murder_mystery.can_find_cufflink:
                op: neq
                val: true
              murder_mystery.quest_complete:
                op: neq
                val: true

    rooms:
      # 2. Fix the Shack Search (Graveyard Entrance)
      graveyard_entrance:
        triggers:
          - id: catch_look_shack
            script: |-
              $if($questvar(%S%,murder_mystery.has_evidence), eq, true){
                echo You've already searched the shack thoroughly. There's nothing else of value here.
              }
              else {
                $if($hasitem(%S%, butler_cufflink), eq, true){
                   echo You've already found the cufflink here.
                }
                else {
                   echo You peer through the cracked window and reach inside, feeling around in the dust.
                   echo Your fingers close on a small piece of metal—cold, engraved, and expensive.
                   give butler_cufflink %S%
                   setquestvar %S% murder_mystery.has_evidence true
                }
              }

      # 3. Fix the Wine Cellar (Hide the weapon, make the search trigger give it)
      manor_house_wine_cellar:
        # Remove the visible candlestick so it must be found via the trigger
        objects:
          - id: bloody_candlestick
            __remove__: true
        
        triggers:
          - id: catch_look_barrels
            script: |
              $if($questvar(%S%,murder_mystery.knows_to_check_cellar), eq, true){
                $if($hasitem(%S%, bloody_candlestick), eq, true){
                   echo You check behind the barrels again, but you've already taken the weapon.
                }
                else {
                   echo Searching carefully behind the barrels, you spot something hidden...
                   pause 0.5
                   echo You pull out a brass candlestick, stained with dried blood!
                   give bloody_candlestick %S%
                   setquestvar %S% murder_mystery.found_murder_weapon true
                }
              }
              else {
                echo Large oak barrels, used for aging wine. Nothing unusual about them.
              }

CHARACTERS:
  - zone: gloomy_graveyard
    characters:
      # 4. Fix Maggie (Barkeep) - Standardize 'yes' to 'true' and add Weapon reaction
      - id: barkeep
        llm_conversation:
          __list_strategy__: replace
          conversation_results:
            - condition: "if and when you tell the player about the murder"
              set:
                murder_mystery.heard_about_murder: true
            - condition: "if and when you tell the player about the butler (Edmund)"
              set:
                murder_mystery.suspects_butler: true
            - condition: "when the player has convinced you they solved the case (cufflink and weapon)"
              set:
                murder_mystery.quest_complete: true
        triggers:
          # Add reaction to receiving the murder weapon
          - id: barkeep_receive_weapon
            type: on_receive
            criteria:
              - subject: '%o%'
                operator: eq
                predicate: bloody_candlestick
            script: |-
              echo Maggie recoils slightly, then looks at you with grim respect.
              echo "Blood... and gray hair," she whispers. "Ashford's hair. This is it. This is the proof."
              setquestvar %S% murder_mystery.found_murder_weapon true
              # Check if we have both pieces to solve it immediately (optional logic, or rely on LLM goal)
              $if($questvar(%S%, murder_mystery.has_evidence), eq, true){
                 setquestvar %S% murder_mystery.quest_complete true
                 say You've done it. I'll send for the constable. Old Tom is safe.
              }

      # 5. Fix Old Tom - Standardize 'yes' to 'true' if any exist (none found, but good practice to verify his goal vars match schema)
      # (His current goals use 'true', so he is fine. No changes needed.)

OBJECTS:
  - zone: gloomy_graveyard
    objects:
      # 6. Update the Candlestick trigger to be robust
      - id: bloody_candlestick
        triggers:
          - id: find_weapon
            script: |-
              echo You examine the candlestick closely. Dark stains mar the base... blood.
              setquestvar %S% murder_mystery.found_murder_weapon true